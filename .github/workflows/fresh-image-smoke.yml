name: Fresh-Image Deployment Smoke

# The deployment-artifact gate (LANCEDB_SEARCH_BACKEND_DESIGN_V1 §6, private
# docs): build the Docker image from this commit, start the compose stack on
# clean volumes with ENFORCED auth, run migrations, and prove
# index → serve (via LanceDB) → persist across restart → recover from drift.
# This validates exactly what an enterprise installs on its internal Linux
# server — no external hosting involved.

on:
  push:
    branches: [ main, dev/v2 ]
  workflow_dispatch:

env:
  APP_IMAGE: local/pgvectorragindexer:smoke
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.smoke.yml

jobs:
  fresh-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Build app image from this commit
      run: docker build -t "$APP_IMAGE" .

    - name: Start database on clean volumes
      run: |
        $COMPOSE up -d db
        for i in $(seq 1 30); do
          if $COMPOSE ps db | grep -q healthy; then echo "db healthy"; break; fi
          [ "$i" = 30 ] && { echo "db never became healthy"; exit 1; }
          sleep 2
        done

    - name: Run migrations (pgvector extension + schema incl. 020)
      run: $COMPOSE run --rm app alembic upgrade head

    - name: Bootstrap admin API key
      id: bootstrap
      run: |
        API_KEY=$($COMPOSE run --rm app python -c \
          "from auth import create_api_key_record; print(create_api_key_record('ci-smoke')['key'])" | tail -1)
        [ -n "$API_KEY" ] || { echo "no key produced"; exit 1; }
        echo "::add-mask::$API_KEY"
        echo "key=$API_KEY" >> "$GITHUB_OUTPUT"

    - name: Start app with enforced auth
      run: |
        $COMPOSE up -d app
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
          if [ "$code" = "200" ]; then echo "app healthy"; break; fi
          [ "$i" = 60 ] && { echo "app never became healthy (last: $code)"; exit 1; }
          sleep 3
        done

    - name: Auth is enforced — search without a key is rejected
      run: |
        code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/search \
          -H 'Content-Type: application/json' -d '{"query":"x"}')
        [ "$code" = "401" ] || { echo "expected 401 without key, got $code"; exit 1; }

    - name: Index a document (authenticated; first call downloads the embedding model)
      env:
        API_KEY: ${{ steps.bootstrap.outputs.key }}
      run: |
        printf 'ZX9-SMOKE-7 widget calibration manual.\nThe flux capacitor requires weekly calibration.\n' > smoke.txt
        resp=$(curl -s --max-time 600 -X POST http://localhost:8000/upload-and-index \
          -H "X-API-Key: $API_KEY" -F "file=@smoke.txt")
        echo "$resp"
        echo "$resp" | grep -q '"status":"success"' || { echo "indexing failed"; exit 1; }

    - name: Search serves the document (LanceDB path)
      env:
        API_KEY: ${{ steps.bootstrap.outputs.key }}
      run: |
        for i in $(seq 1 20); do
          resp=$(curl -s -X POST http://localhost:8000/search \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"query":"ZX9-SMOKE-7 calibration","top_k":5,"min_score":0}')
          if echo "$resp" | grep -q 'smoke.txt'; then echo "search OK"; exit 0; fi
          sleep 3
        done
        echo "search never returned the document; last response: $resp"; exit 1

    - name: Restart container — index persists
      env:
        API_KEY: ${{ steps.bootstrap.outputs.key }}
      run: |
        $COMPOSE restart app
        for i in $(seq 1 40); do
          resp=$(curl -s -X POST http://localhost:8000/search \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"query":"ZX9-SMOKE-7 calibration","top_k":5,"min_score":0}' || true)
          if echo "$resp" | grep -q 'smoke.txt'; then echo "persistence OK"; exit 0; fi
          sleep 3
        done
        echo "search did not recover after restart; last response: $resp"; exit 1

    - name: Induced LanceDB drift self-heals from Postgres
      env:
        API_KEY: ${{ steps.bootstrap.outputs.key }}
      run: |
        $COMPOSE exec -T app sh -c 'rm -rf /app/data/lancedb/*'
        $COMPOSE restart app
        for i in $(seq 1 60); do
          resp=$(curl -s -X POST http://localhost:8000/search \
            -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' \
            -d '{"query":"ZX9-SMOKE-7 calibration","top_k":5,"min_score":0}' || true)
          if echo "$resp" | grep -q 'smoke.txt'; then echo "drift recovery OK"; exit 0; fi
          sleep 3
        done
        echo "search did not recover from induced drift; last response: $resp"; exit 1

    - name: Dump logs on failure
      if: failure()
      run: $COMPOSE logs --tail 200

  # The path that shipped broken in v2.17.0. Every check above sends an API key,
  # so nothing exercised a default single-machine install, and a release that
  # 401'd against its own machine went out green. This job runs the compose file
  # exactly as a user gets it: no override, no key.
  install-defaults:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Build app image from this commit
      run: docker build -t "$APP_IMAGE" .

    - name: Start the stack the way a single-machine install does
      run: |
        docker compose up -d db
        for i in $(seq 1 30); do
          if docker compose ps db | grep -q healthy; then echo "db healthy"; break; fi
          [ "$i" = 30 ] && { echo "db never became healthy"; exit 1; }
          sleep 2
        done
        docker compose run --rm app alembic upgrade head
        docker compose up -d app
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
          if [ "$code" = "200" ]; then echo "app healthy"; break; fi
          [ "$i" = 60 ] && { echo "app never became healthy (last: $code)"; exit 1; }
          sleep 3
        done

    - name: An authenticated endpoint answers WITHOUT a key on the local install
      run: |
        for ep in /documents /stats; do
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$ep")
          [ "$code" = "200" ] || { echo "expected 200 on $ep without a key, got $code"; exit 1; }
        done

    - name: ...and that is only safe because the port is not published to the network
      run: |
        LAN_IP=$(hostname -I | awk '{print $1}')
        echo "probing $LAN_IP:8000 - it must refuse"
        code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$LAN_IP:8000/health" || true)
        [ "$code" = "000" ] || { echo "API answered on the LAN address with $code; loopback publish is broken"; exit 1; }

    - name: Server config requires a key from a non-loopback client
      run: |
        docker compose down
        LAN_IP=$(hostname -I | awk '{print $1}')
        API_BIND_ADDRESS=0.0.0.0 API_REQUIRE_AUTH=true docker compose up -d
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$LAN_IP:8000/health" || true)
          if [ "$code" = "200" ]; then echo "app healthy on $LAN_IP"; break; fi
          [ "$i" = 60 ] && { echo "app never became reachable (last: $code)"; exit 1; }
          sleep 3
        done
        code=$(curl -s -o /dev/null -w '%{http_code}' "http://$LAN_IP:8000/documents")
        [ "$code" = "401" ] || { echo "expected 401 from a LAN client without a key, got $code"; exit 1; }

    - name: Dump logs on failure
      if: failure()
      run: docker compose logs --tail 200

  first-run-schema-survives:
    # The bug this job exists for: on 2026-09-10 a genuinely fresh install
    # destroyed its own schema on first start. migrate.py wrote a pre-migration
    # pg_dump of an EMPTY database, then auto_recovery saw "a backup exists"
    # plus "document_chunks is empty", called it data loss, dropped the
    # database and restored the empty dump over the schema migrations had just
    # created. The container then reported healthy, and /health said "healthy"
    # with no tables in the database at all.
    #
    # The other jobs here cannot catch it, and that is the point: they run
    # `alembic upgrade head` out of band first, so the app's own startup finds
    # nothing pending and never writes the backup that triggers it. This job
    # deliberately does NOT migrate out of band — it starts the stack exactly
    # the way `docker-run.sh` and the MSI do, with an empty backups directory,
    # and lets the application migrate itself.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Build app image from this commit
      run: docker build -t "$APP_IMAGE" .

    - name: Confirm the backups directory starts empty
      run: |
        mkdir -p backups
        # A fresh clone has no backups/ (it is gitignored) and docker-run.sh
        # never creates one, so Docker makes it empty. That empty directory is
        # the condition every other job here is missing.
        found=$(ls -A backups 2>/dev/null | wc -l)
        [ "$found" = "0" ] || { echo "backups/ is not empty ($found entries); this job needs a fresh state"; exit 1; }

    - name: Start the stack with no out-of-band migration
      run: |
        docker compose up -d db
        for i in $(seq 1 30); do
          if docker compose ps db | grep -q healthy; then echo "db healthy"; break; fi
          [ "$i" = 30 ] && { echo "db never became healthy"; exit 1; }
          sleep 2
        done
        docker compose up -d app
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
          if [ "$code" = "200" ]; then echo "app responding"; break; fi
          [ "$i" = 60 ] && { echo "app never responded (last: $code)"; exit 1; }
          sleep 3
        done

    - name: The schema must still exist
      run: |
        # The direct assertion. Before the fix this printed 0.
        tables=$(docker compose exec -T db psql -U rag_user -d rag_vector_db -tAc \
          "select count(*) from information_schema.tables where table_schema='public';" | tr -d '[:space:]')
        echo "public tables: $tables"
        [ "$tables" -gt 5 ] || { echo "SCHEMA WAS DESTROYED ON FIRST RUN (found $tables tables)"; docker compose logs app | tail -40; exit 1; }
        docker compose exec -T db psql -U rag_user -d rag_vector_db -tAc \
          "select 1 from information_schema.tables where table_name='document_chunks';" | grep -q 1 \
          || { echo "document_chunks is missing"; exit 1; }

    - name: No false data-loss diagnosis was made
      run: |
        if docker compose logs app | grep -q "DATA LOSS DETECTED"; then
          echo "auto_recovery claimed data loss on a fresh install"
          docker compose logs app | grep -A3 "DATA LOSS DETECTED"
          exit 1
        fi
        echo "no false positive"

    - name: /health and /ready tell the truth
      run: |
        # Working install: both say so.
        curl -sf http://localhost:8000/ready >/dev/null || { echo "/ready failed on a working install"; exit 1; }
        status=$(curl -s http://localhost:8000/health | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
        [ "$status" = "healthy" ] || { echo "expected healthy, got $status"; exit 1; }

        # Now break it, and require the signals to change. /health stays 200
        # because the desktop client reads the body for the reason; /ready is
        # the machine-readable signal and must fail.
        docker compose exec -T db psql -U rag_user -d rag_vector_db -c "DROP TABLE document_chunks CASCADE;"

        code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)
        [ "$code" = "503" ] || { echo "/ready returned $code for a broken database; it must be 503"; exit 1; }

        status=$(curl -s http://localhost:8000/health | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])")
        [ "$status" = "degraded" ] || { echo "/health said '$status' with no document_chunks table; it must not say healthy"; exit 1; }
        echo "both endpoints report the truth"
