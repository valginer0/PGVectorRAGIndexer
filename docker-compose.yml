# PGVectorRAGIndexer Docker Compose Configuration
# 
# For production deployment, use the automated scripts:
#   Linux/macOS/WSL: curl -fsSL https://raw.githubusercontent.com/valginer0/PGVectorRAGIndexer/main/docker-run.sh | bash
#   Windows: See INSTALL_DESKTOP_APP.md
#
# For development, create a .env file with:
#   POSTGRES_USER=rag_user
#   POSTGRES_PASSWORD=<pick your own; don't copy one out of this repo>
#   POSTGRES_DB=rag_vector_db
#   API_HOST=0.0.0.0
#   API_PORT=8000

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: vector_rag_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_vector_db}
    ports:
      # Loopback only: the app reaches the DB over the internal docker network
      # (DB_HOST: db), so this mapping exists purely for local psql and tests.
      # Publishing it on 0.0.0.0 exposed the database, and its default
      # credentials, to the whole network.
      #
      # DB_BIND_ADDRESS can move this off loopback, but almost nothing should:
      # the fallback credentials are published in this repo. If tests cannot
      # reach the database, suspect another process owning 5432 on the host
      # rather than this binding - see .env.example.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_vector_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # PGVectorRAGIndexer application
  app:
    image: ${APP_IMAGE:-ghcr.io/valginer0/pgvectorragindexer:latest}
    container_name: vector_rag_app
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_vector_db}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-0}
      # Single-machine default. A request from the host reaches the container
      # from the docker gateway address, never 127.0.0.1, so the app's loopback
      # exemption cannot fire behind a published port - turning auth off here is
      # what keeps a local install key-free. Safe only because the port above is
      # published on loopback. server-setup.sh sets this to true for servers.
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-false}
    ports:
      # Loopback only. A single-machine install is reachable from this machine
      # and nowhere else, which is what lets it run without an API key.
      # To serve other machines (team server, NAS): set API_BIND_ADDRESS=0.0.0.0
      # AND API_REQUIRE_AUTH=true in .env, then create an API key.
      # server-setup.sh does both for you. Publishing this on every interface
      # without auth is the exposure 27ad599 closed - don't reopen it.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./documents:/app/documents
      - ./backups:/app/backups
      - ./data:/app/data
      # LanceDB storage path (named volume overlay to bypass slow 9p bridge on Windows/WSL2)
      - lancedb_data:/app/data/lancedb
      - model_cache:/root/.cache/huggingface
      - ${HOME:-.}/.pgvector-license:/root/.pgvector-license:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network

volumes:
  postgres_data:
  model_cache:
  lancedb_data:

networks:
  rag_network:
