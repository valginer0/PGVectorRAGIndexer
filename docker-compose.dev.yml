# PGVectorRAGIndexer Development Docker Compose Configuration
# 
# This file is for local development and testing.
# It builds the Docker image locally instead of pulling from GHCR.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
#   docker compose -f docker-compose.dev.yml build app

services:
  # PostgreSQL database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: vector_rag_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_vector_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_user} -d ${POSTGRES_DB:-rag_vector_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

  # PGVectorRAGIndexer application (built locally in WSL, pulled from GHCR on Windows)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - ghcr.io/valginer0/pgvectorragindexer:dev
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: ghcr.io/valginer0/pgvectorragindexer:dev
    container_name: vector_rag_app
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rag_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password}
      POSTGRES_DB: ${POSTGRES_DB:-rag_vector_db}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      # Single-machine default. A request from the host reaches the container
      # from the docker gateway address, never 127.0.0.1, so the app's loopback
      # exemption cannot fire behind a published port - turning auth off here is
      # what keeps a local install key-free. Safe only because the port below is
      # published on loopback.
      API_REQUIRE_AUTH: ${API_REQUIRE_AUTH:-false}
    ports:
      # Loopback only. A single-machine install is reachable from this machine
      # and nowhere else, which is what lets it run without an API key.
      # To serve other machines (team server, NAS): set API_BIND_ADDRESS=0.0.0.0
      # AND API_REQUIRE_AUTH=true in .env, then create an API key.
      # server-setup.sh does both for you. Publishing this on every interface
      # without auth is the exposure 27ad599 closed - don't reopen it.
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./documents:/app/documents
      - ./data:/app/data
      # LanceDB storage path (named volume overlay to bypass slow 9p bridge on Windows/WSL2)
      - lancedb_data:/app/data/lancedb
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network

volumes:
  postgres_data:
  model_cache:
  lancedb_data:

networks:
  rag_network:
